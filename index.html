    @media (prefers-color-scheme: dark) {

    li { margin:.45em 0; }
    hr { border:0; border-top:1px solid var(--line); margin:1.6em 0; }
    .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:1em 0; }
    table { border-collapse:collapse; width:100%; font-size:.95rem; }
    th, td { border:1px solid var(--line); padding:.5em .6em; text-align:left; vertical-align:top; }
    th { background:var(--code); }
    code { background:var(--code); padding:.1em .35em; border-radius:4px; font-size:.92em; }
    footer { margin-top:3em; padding-top:1em; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
    footer a { color:var(--link); }
    .card { border:1px solid var(--line); border-radius:10px; padding:.2em 1em; margin:1em 0; }
    .card h2 { border:0; margin:.8em 0 .2em; }
    .card p { margin:.3em 0 .9em; }
